[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshscore"
version = "0.1.0"
description = "Live sports scores for MeshCore LoRa mesh channels: NHL, MLB, NFL, OHL/CHL - with a bot per team."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "MeshScore contributors" }]
keywords = ["meshcore", "lora", "mesh", "sports", "scoreboard", "bot", "nhl", "mlb", "nfl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Ham Radio",
]
dependencies = [
    "meshcore>=2.3",
    "requests>=2.28",
    "tomli>=2.0; python_version < '3.11'",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
ble = ["bleak>=0.21"]
dev = ["pytest>=7", "pytest-cov>=4", "hypothesis>=6", "ruff>=0.4"]

[project.scripts]
meshscore = "meshscore.cli:main"

[project.urls]
Homepage = "https://github.com/Harve6/meshscore"
Issues = "https://github.com/Harve6/meshscore/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: talks to the real league APIs (skipped with -m 'not network')"]

[tool.ruff]
line-length = 140
target-version = "py310"
exclude = ["tests/suites"]

[tool.ruff.lint]
select = ["F"]
