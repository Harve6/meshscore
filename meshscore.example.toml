# MeshScore example configuration. Copy to meshscore.toml (or run `meshscore init`).
# Every setting is documented in docs/configuration.md. Lines starting with # are the defaults / examples.

[radio]
transport = "serial"           # serial (USB) | ble (Bluetooth) | tcp (WiFi)
port = "COM3"                  # /dev/ttyUSB0 on Linux. `meshscore ports` lists what's connected
# host = "192.168.1.50"        # tcp: the radio's IP
# tcp_port = 5000
# ble_address = ""             # ble: `meshscore scan-ble`
# ble_pin = "123456"

[bot]
timezone = "America/Toronto"   # empty = this computer's zone
# default_mode = "max"         # max = everything | min = period/inning results + final | off
# announce_on_start = false    # true = post "active on #channel" at start
# admin_names = []             # who may use !mode / !phase (empty = anyone; names can be spoofed)
# admin_keys = []              # public-key prefixes allowed to do so by DM (authenticated)

[same_air]                     # several MeshScore bots on one mesh (see docs/same-air.md)
# enabled = true
# rank = -1                    # place in the line-up: 0 posts first, 1 waits a slot ... (-1 = by node name)
# peers = []                   # node names of your other bots

[airtime]
# max_per_hour = 0             # cap on alert messages per hour (0 = none); finals always go out

# ---------------------------------------------------------------- bots (one table each)
# NAME is also the command prefix ("!leafs score") and the state-file name.
# The channel must already exist on the radio.

[bots.leafs]
type = "nhl"
team = "TOR"                   # `meshscore teams nhl`
label = "Toronto Maple Leafs"
channel = "#leafs"

# [bots.jays]
# type = "mlb"
# team = "TOR"                 # `meshscore teams mlb`
# tag = "JAYS"                 # text in messages instead of the team code
# channel = "#jays"

# [bots.bills]
# type = "nfl"
# team = "BUF"                 # `meshscore teams nfl`
# channel = "#bills"

# [bots.ohl]                   # the OHL: one team, or leave `team` out for the whole league
# type = "ohl"
# team = "KIT"                 # `meshscore teams ohl`
# priority_teams = ["KIT"]
# channel = "#ohl"

# [bots.mlb]                   # every MLB postseason game - on its own channel, or add it on a team channel
# type = "mlb-postseason"      # (e.g. #jays above) so that channel also follows the playoffs when your team is out
# channel = "#mlb"
# skip_teams = ["TOR"]         # teams whose own bot already posts their games on this channel

# [bots.market]                # not sports: indices, stocks, commodities, crypto, headlines (docs/market.md)
# type = "market"
# channel = "#market"
# tag = "MKT"
# watch = ["AAPL", "NVDA", "SHOP.TO"]   # optional: alerts on big moves, and !watch

# [bots.chess]                 # not sports: the whole channel plays one chess game against a bot (docs/chess.md)
# type = "chess"               # needs: pip install chess
# channel = "#chess"
# window_minutes = 5           # the vote clock that starts at the first !move of a round
# site_dir = "C:/Users/you/meshscore-chess"   # a clone of your GitHub Pages repo: the bot pushes state.json there
# site_url = "https://YOU.github.io/meshscore-chess/"
# puzzle_hour = 9              # the daily Lichess puzzle is posted in this hour (puzzle = false turns it off)
# stockfish = ""               # optional path to a Stockfish binary for the stronger levels

# [bots.pokemon]              # the whole channel plays one Pokemon Red game (docs/pokemon.md) - bring your own ROM
# type = "pokemon"            # needs: pip install pyboy pillow
# channel = "#pokemon"
# rom = "C:/path/to/Pokemon Red.gb"      # one game ... or several, with a daily vote (see docs/pokemon.md):
# [bots.pokemon.roms]
# red = "C:/roms/Pokemon Red.gb"
# blue = "C:/roms/Pokemon Blue.gb"
# yellow = "C:/roms/Pokemon Yellow.gb"
# window_seconds = 30        # the vote clock that starts at the first vote of a round
# site_dir = "C:/Users/you/meshscore-pokemon"   # a clone of its own GitHub Pages repo
# site_url = "https://YOU.github.io/meshscore-pokemon/"

# --- daily games on one shared channel, answered by DM (docs/daily-games.md) ---
# [bots.word]                 # a daily 5-letter word
# type = "word"
# channel = "#daily"
# [bots.trivia]               # a daily multiple-choice question
# type = "trivia"
# channel = "#daily"
# [bots.pickem]               # pick the winners of today's games (ESPN scoreboard)
# type = "pickem"
# channel = "#daily"
# leagues = ["nhl", "nfl"]
# teams = ["TOR", "BUF"]
# [bots.coverage]             # who reaches your radio, how far (posts nothing)
# type = "coverage"
# channel = "#daily"
# [bots.weather]              # !weather + Environment Canada warnings
# type = "weather"
# channel = "#daily"
# place = "Kitchener"
# lat = 43.4516
# lon = -80.4925
# (each can also share one web page: site_api / site_token / site_url, see docs/daily-games.md)

